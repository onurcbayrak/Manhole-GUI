[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-manhole-gui"
version = "0.1.0"
description = "Ortofotolarda menhol/rögar tespiti için YOLO tabanlı masaüstü arayüz (SAS makalesi)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Onur Can Bayrak" }]

dependencies = [
    "PySide6>=6.6,<6.10",  # 6.11.x bu ortamda kırık bir DLL ile geliyor (QtCore import hatası); 6.9.2 doğrulandı
    "rasterio>=1.3",
    "ultralytics>=8.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.scripts]
manhole-gui = "sas_manhole_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sas_manhole_gui" = ["resources/*"]
